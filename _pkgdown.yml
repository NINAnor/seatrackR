reference:
- title: Shiny app
  desc: Use the seatrackR shiny interface
  contents: has_concept("shiny")
- title: Database Connections
  desc: Functions for connecting to and disconnecting from the Seatrack database.
  contents: has_concept("db_connection")
- title: Metadata
- desc: Functions for reading metadata from the database.
  contents: has_concept("metadata")
- title: logger_info
  desc: Functions for reading logger information from the database.
  contents: has_concept("logger_info")
- title: Positions
  desc: Functions for reading positional data from the database.
  contents: has_concept("positions")
- title: Recordings
  desc: Functions for reading "recording" data from the database.
  contents: has_concept("activity")
- title: Files
  desc: Functions for reading and writing file information to the database and FTP
    server.
  contents: has_concept("files")
- title: Database import functions
  desc: Functions to write to database import tables
  contents: has_concept("data_import")
- title: Utility functions
  desc: Various utility functions included in the package.
- subtitle: General Database Functions
  desc: General functions related to the SEATRACK database.
  contents: has_concept("general_db")
- subtitle: Data
  desc: Example datasets included in the package.
  contents: has_concept("data")
- subtitle: Plotting functions
  desc: Shortcuts for plotting SEATRACK data.
  contents: has_concept("plotting")
- subtitle: Database conversion functions
  desc: Functions to prepare R data for queries
  contents: has_concept("db_utility")
